[project]
name = "mission-control-common"
version = "0.3.0"
description = "Shared launcher, suite menu, help pages, and Brightlayer UI base styles for the Mission Control apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mission_control*"]

[tool.setuptools.package-data]
mission_control = ["templates/**/*", "static/**/*", "help/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
